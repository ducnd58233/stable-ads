name: stable-ads-ml

services:
  mlflow:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.mlflow
    env_file:
      - ../../../.env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DB:-stable-ads}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      AWS_CA_BUNDLE: ""
      S3_USE_SSL: "false"
      MLFLOW_TRACKING_SERVER_HOST: "0.0.0.0"
      MLFLOW_TRACKING_SERVER_PORT: "5000"
      PYTHONUNBUFFERED: "1"
      FLASK_ENV: "production"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3