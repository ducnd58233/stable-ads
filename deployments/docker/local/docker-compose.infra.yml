name: stable-ads-infrastructure

x-kafka-common-env: &kafka-common-env
  # KRaft roles
  KAFKA_PROCESS_ROLES: "broker,controller"
  # Node id differs per broker
  # KAFKA_NODE_ID is set per service below
  CLUSTER_ID: "${MQ_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
  KAFKA_CLUSTER_ID: "${MQ_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
  # Listeners mapping
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  # Replication (for 3-node dev)
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"

x-postgres-common: &postgres-common
  image: postgres:17
  restart: unless-stopped
  env_file:
    - ../../../.env
  environment:
    POSTGRES_USER: ${DB_USER:-postgres}
    POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  volumes:
    - postgres-data:/var/lib/postgresql/data

services:
  # Main application database
  postgres:
    <<: *postgres-common
    environment:
      POSTGRES_DB: ${DB_DB:-stable-ads}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ../../../.env
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${STORAGE_API_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set stable-ads http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb stable-ads/videos --ignore-existing;
      /usr/bin/mc mb stable-ads/raw-events --ignore-existing;
      /usr/bin/mc mb stable-ads/validated-events --ignore-existing;
      /usr/bin/mc mb stable-ads/invalidated-events --ignore-existing;
      /usr/bin/mc mb stable-ads/processed-data --ignore-existing;
      /usr/bin/mc mb stable-ads/features --ignore-existing;
      /usr/bin/mc mb stable-ads/models --ignore-existing;
      /usr/bin/mc mb stable-ads/checkpoints --ignore-existing;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ../../../.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "19092:19092"
    env_file:
      - ../../../.env
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: "PLAINTEXT://kafka-1:9092,CONTROLLER://kafka-1:9093,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "29092:29092"
    env_file:
      - ../../../.env
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "PLAINTEXT://kafka-2:9092,CONTROLLER://kafka-2:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "39092:39092"
    env_file:
      - ../../../.env
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "PLAINTEXT://kafka-3:9092,CONTROLLER://kafka-3:9093,EXTERNAL://0.0.0.0:39092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  createtopics:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      sleep 10;
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic render-requests --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic render-results --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic render-dlq --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic user-behavior-raw --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic user-behavior-validated --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic user-behavior-invalidated --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic feature-engineering --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic prediction-requests --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic prediction-results --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic training-trigger --partitions ${MQ_DEFAULT_PARTITIONS:-3} --replication-factor ${MQ_DEFAULT_REPLICATION_FACTOR:-3};
      echo 'Topics created successfully';
      exit 0;
      "

  ollama:
    image: ollama/ollama:latest
    env_file:
      - ../../../.env
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  redis-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  ollama:

