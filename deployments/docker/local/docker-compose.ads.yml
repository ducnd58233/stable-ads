name: stable-ads-ads

services:
  api:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.ads-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    env_file:
      - ../../../.env
    environment:
      - DB_HOST=postgres
      - STORAGE_ENDPOINT=minio:9000
      - MQ_BROKERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.ads-worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    env_file:
      - ../../../.env
    environment:
      - DB_HOST=postgres
      - STORAGE_ENDPOINT=minio:9000
      - MQ_BROKERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "${WORKER_PORT:-8001}:8001"
    restart: unless-stopped
