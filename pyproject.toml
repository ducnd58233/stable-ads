[project]
name = "stable-ads"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "diffusers[torch]>=0.35.2",
    "ftfy>=6.3.1",
    "transformers>=4.57.1",
    "torch>=2.0.0",
    "bitsandbytes>=0.48.2",
    "hf-xet>=1.2.0",
    "opencv-python>=4.12.0.88",
    "fastapi[standard]>=0.121.0",
    "langchain>=1.0.4",
    "langchain-openai>=1.0.2",
    "langchain-ollama>=1.0.0",
    "pydantic-settings>=2.11.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.44",
    "minio>=7.2.18",
    "aiokafka>=0.12.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
